name: Supplemental browser failure triage
on:
  workflow_call:
    inputs:
      revision:
        description: Frozen synthetic merge from upstream CI
        required: true
        type: string
      base:
        description: Frozen upstream parent of that merge
        required: true
        type: string
permissions:
  contents: read
jobs:
  paired:
    name: Supplemental browser failure triage (${{ matrix.side }})
    if: github.repository == 'lucafucci/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: base
            revision: 24fa8e716fc4d8b655a21d8edd063c50f04efcfb
          - side: candidate
            revision: a6edbf2109ae92b1cd7a8fd936f87778322c96f0
    defaults:
      run:
        shell: bash
    env:
      TRIAGE_SIDE: ${{ matrix.side }}
      TRIAGE_REVISION: ${{ matrix.revision }}
      TRIAGE_BASE: ${{ inputs.base }}
      TRIAGE_CANDIDATE: ${{ inputs.revision }}
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - name: Require the exact failed CI pair
        run: |
          set -euo pipefail
          [[ "$TRIAGE_BASE" == 24fa8e716fc4d8b655a21d8edd063c50f04efcfb ]]
          [[ "$TRIAGE_CANDIDATE" == a6edbf2109ae92b1cd7a8fd936f87778322c96f0 ]]
      - name: Checkout workflow-owned triage helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve helper and workflow identity
        run: |
          set -euo pipefail
          TRIAGE_HELPER="$RUNNER_TEMP/browser-failure-triage.mjs"
          TRIAGE_OUTPUT="$RUNNER_TEMP/browser-failure-triage-evidence"
          mkdir -p "$TRIAGE_OUTPUT"
          cp .github/authority-proof/browser-failure-triage.mjs "$TRIAGE_HELPER"
          echo "TRIAGE_HELPER=$TRIAGE_HELPER" >> "$GITHUB_ENV"
          echo "TRIAGE_OUTPUT=$TRIAGE_OUTPUT" >> "$GITHUB_ENV"
          echo "OPENCLAW_UI_E2E_DIAGNOSTIC_DIR=$RUNNER_TEMP/browser-failure-triage-diagnostics" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$TRIAGE_OUTPUT/workflow-revision.txt"
          sha256sum "$TRIAGE_HELPER" | cut -d ' ' -f 1 > "$TRIAGE_OUTPUT/helper-sha256.txt"
      - name: Checkout exact upstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.revision }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify selected source
        id: source
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$TRIAGE_REVISION" ]]
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$TRIAGE_REVISION" > "$TRIAGE_OUTPUT/revision.txt"
          printf '%s\n' "$TRIAGE_BASE" > "$TRIAGE_OUTPUT/base.txt"
          printf '%s\n' "$TRIAGE_CANDIDATE" > "$TRIAGE_OUTPUT/candidate.txt"
      - name: Setup pinned Node and frozen physical dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          frozen-lockfile: "true"
          semantic-checks: "true"
          cache-mode: off
      - name: Record installed toolchains
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node --version > "$TRIAGE_OUTPUT/node-version.txt"
          pnpm --version > "$TRIAGE_OUTPUT/pnpm-version.txt"
      - name: Build the selected runtime and Control UI
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm build:runtime 2>&1 | tee "$TRIAGE_OUTPUT/build.log"
      - name: Prepare Chromium
        id: chromium
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts --require-playwright-chromium 2>&1 | tee "$TRIAGE_OUTPUT/chromium.log"
      - name: Agent Tools loading skeletons
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node "$TRIAGE_HELPER" run tools-loading
      - name: Context breakdown at 1440 pixels
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node "$TRIAGE_HELPER" run context-desktop
      - name: Context breakdown at 390 pixels
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node "$TRIAGE_HELPER" run context-mobile
      - name: Summarize every selected case without converting failures to passes
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: node "$TRIAGE_HELPER" summary
      - name: Upload only synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-triage-supplemental-${{ matrix.side }}-${{ matrix.revision }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-failure-triage-evidence/*.txt
            ${{ runner.temp }}/browser-failure-triage-evidence/*.log
            ${{ runner.temp }}/browser-failure-triage-evidence/*-vitest.json
            ${{ runner.temp }}/browser-failure-triage-evidence/*-result.json
            ${{ runner.temp }}/browser-failure-triage-evidence/summary.json
          retention-days: 7
