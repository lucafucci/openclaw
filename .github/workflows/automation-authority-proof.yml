name: Automation authority proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'lucafucci/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: android-green
            revision: b7e2173a3e4298d665d9163d0cb8be62341cbbe1
          - lane: android-red
            revision: 4c65e292c6c685d0a6eeb26927656d908b61c297
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
          fetch-depth: 3
      - name: Setup pinned toolchain and dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          semantic-checks: "true"
          cache-mode: off
      - name: Pin evidence
        run: |
          PROOF_OUTPUT="$RUNNER_TEMP/authority-proof"
          echo "PROOF_OUTPUT=$PROOF_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_OUTPUT"
          git rev-parse HEAD | tee "$PROOF_OUTPUT"/revision.txt
          node --version
          pnpm --version
      - name: Android focused formatting
        if: matrix.lane == 'android-green'
        run: pnpm exec oxfmt --check src/agents/cron-creator-authority-context.ts src/agents/subagents/requester-cron-authority.ts src/gateway/server-methods/requester-cron-authority.integration.test.ts test/e2e/qa-lab/runtime/gateway-android-automation-authority.e2e.test.ts
      - name: Android continuation regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run src/gateway/server-methods/requester-cron-authority.integration.test.ts src/agents/cron-creator-authority-context.test.ts --maxWorkers=1 2>&1 | tee "$PROOF_OUTPUT"/android-continuation.log
      - name: Upload continuation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: continuation-${{ matrix.lane }}-${{ matrix.revision }}
          path: ${{ runner.temp }}/authority-proof
          retention-days: 7
      - name: Android authenticated protocol proof
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.lane == 'android-green' }}
        env:
          # This in-process test owns its provider and empty plugin fixtures; it does not launch dist.
          OPENCLAW_E2E_SKIP_BUILD: "1"
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run test/e2e/qa-lab/runtime/gateway-android-automation-authority.e2e.test.ts --maxWorkers=1 2>&1 | tee "$PROOF_OUTPUT"/android-protocol.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: authority-${{ matrix.lane }}-${{ matrix.revision }}
          path: ${{ runner.temp }}/authority-proof
          retention-days: 7
