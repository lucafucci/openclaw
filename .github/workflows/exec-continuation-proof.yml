name: Background exec continuation proof
on:
  workflow_dispatch:
  push:
    branches: [proof/automation-authority]
    paths:
      - .github/workflows/exec-continuation-proof.yml
      - .github/authority-proof/exec-continuation-*.mts
      - .github/authority-proof/exec-continuation-overlay/**
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'lucafucci/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PROOF_WORKFLOW_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout immutable proof helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Install exact Gateway in disposable prefix
        run: |
          set -euo pipefail
          cp -R .github/authority-proof/exec-continuation-overlay "$RUNNER_TEMP/exec-continuation-overlay"
          mkdir -p "$RUNNER_TEMP/exec-continuation-overlay/candidates/installation" "$RUNNER_TEMP/exec-continuation-evidence/baseline" "$RUNNER_TEMP/exec-continuation-evidence/candidate"
          npm install --prefix "$RUNNER_TEMP/exec-continuation-overlay/candidates/installation" --omit=dev --no-audit --no-fund openclaw@2026.10.8
      - name: Reproduce the reported authority failure with native Codex
        id: baseline
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 600s node .github/authority-proof/exec-continuation-codex-proof.mts \
            "$RUNNER_TEMP/exec-continuation-evidence/baseline" \
            "$RUNNER_TEMP/exec-continuation-overlay/candidates/installation/node_modules/openclaw" \
            2>&1 | tee "$RUNNER_TEMP/exec-continuation-evidence/baseline/proof.log"
          result=${PIPESTATUS[0]}
          set -e
          [[ "$result" == 1 ]]
          node --input-type=module - "$RUNNER_TEMP/exec-continuation-evidence/baseline/result.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(result.stage,'background-exec-continuation');
          assert.equal(result.failure,true,'baseline must reproduce the exact authority failure');
          assert.equal(result.resumed,false);
          assert.equal(result.calls,2);
          JS
      - name: Apply the source-derived continuation backport to the isolated package
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/exec-continuation-overlay/apply.mjs" "$RUNNER_TEMP/exec-continuation-overlay/candidates/installation/node_modules/openclaw" apply
          node "$RUNNER_TEMP/exec-continuation-overlay/apply.mjs" "$RUNNER_TEMP/exec-continuation-overlay/candidates/installation/node_modules/openclaw" verify
      - name: Require the same native Codex continuation to succeed
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s node .github/authority-proof/exec-continuation-codex-proof.mts \
            "$RUNNER_TEMP/exec-continuation-evidence/candidate" \
            "$RUNNER_TEMP/exec-continuation-overlay/candidates/installation/node_modules/openclaw" \
            2>&1 | tee "$RUNNER_TEMP/exec-continuation-evidence/candidate/proof.log"
      - name: Upload bounded synthetic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exec-continuation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exec-continuation-evidence/*/result.json
            ${{ runner.temp }}/exec-continuation-evidence/*/proof.log
            ${{ runner.temp }}/exec-continuation-evidence/*/native-tool-catalog.json
            ${{ runner.temp }}/exec-continuation-evidence/*/plugin-install-result.json
          retention-days: 7
          if-no-files-found: warn
